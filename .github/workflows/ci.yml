name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }}, ${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Swift (swift-tools-version 6.2) and the newest.
        swift: ["6.2", "6.4"]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Install SQLite
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libsqlite3-dev

      - name: Toolchain
        run: swift --version

      - name: Build (warnings are errors)
        run: |
          flags="-c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors"
          # @testable imports need testing enabled in an optimized build.
          [ "${{ matrix.configuration }}" = release ] && flags="$flags -Xswiftc -enable-testing"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          swift build --build-tests $flags

      - name: Test
        run: swift test $FLAGS

  macos:
    name: macOS (Xcode ${{ matrix.xcode }}, ${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest Xcode with Swift 6.2, and the runner's default.
        xcode: ["26.0.1", "26.6"]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          swift --version

      - name: Build (warnings are errors)
        run: |
          flags="-c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors"
          # @testable imports need testing enabled in an optimized build.
          [ "${{ matrix.configuration }}" = release ] && flags="$flags -Xswiftc -enable-testing"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          swift build --build-tests $flags

      - name: Test
        run: swift test $FLAGS

  ios:
    name: iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      # The test target builds at the package's iOS 15 deployment target, so this also
      # catches APIs that need a newer iOS. No SWIFT_TREAT_WARNINGS_AS_ERRORS: Xcode builds the
      # Perfect-CRUD dependency with warnings suppressed, and the two flags conflict. The macOS
      # and Linux jobs check warnings.
      - name: Test
        run: |
          xcodebuild test -scheme PerfectSQLite \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
